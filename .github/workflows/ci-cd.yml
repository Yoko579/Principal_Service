name: CI-CD principalProject

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Compilation, tests et Docker
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v7

      - name: Installation de Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilation et tests Maven
        run: mvn -B -ntp clean verify

      - name: Vérification du JAR
        run: |
          ls -lh target/
          test -f target/PrincipalService-0.0.1-SNAPSHOT.jar

      - name: Sauvegarde du JAR
        uses: actions/upload-artifact@v4
        with:
          name: principalproject-jar
          path: target/PrincipalService-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

      - name: Construction de l'image Docker
        run: docker build -t principal-project:1.0 .

      - name: Démarrage du conteneur Docker
        run: |
          docker run -d \
            --name principal-ci \
            -p 8000:8000 \
            principal-project:1.0

      - name: Vérification du service
        run: |
          for i in $(seq 1 30); do
            RESPONSE=$(curl -fsS http://localhost:8000/principal/test 2>/dev/null || true)

            if [ "$RESPONSE" = "0" ]; then
              echo "Service Principal accessible : réponse = 0"
              exit 0
            fi

            sleep 2
          done

          echo "Service Principal inaccessible ou réponse incorrecte"
          docker logs principal-ci
          exit 1

      - name: Arrêt du conteneur
        if: always()
        run: docker rm -f principal-ci || true
